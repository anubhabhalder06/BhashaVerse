<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org https://unpkg.com; connect-src 'self'; base-uri 'self'; form-action 'self';">
<title>Search · Matrika</title>
<meta name="description" content="Cross-archive search across languages, scripts, digital library records, photographs, audio slots, and community stories.">
<meta property="og:site_name" content="Matrika">
<meta property="og:title" content="Search · Matrika">
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&family=Caveat:wght@400;600&family=Noto+Serif+Devanagari:wght@400;600&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components/header.css">
<link rel="stylesheet" href="css/components/wordmark.css">
<link rel="stylesheet" href="css/components/footer.css">
<link rel="stylesheet" href="css/components/button.css">
<link rel="stylesheet" href="css/components/badge.css">
<link rel="stylesheet" href="css/components/form.css">
<link rel="stylesheet" href="css/components/chat.css">
<link rel="stylesheet" href="css/pages/subpages.css">
<link rel="stylesheet" href="css/print.css" media="print">
<script type="module" src="js/main.js"></script>
</head>
<body class="mt-paper-grain" data-page="search">
<a class="skip-link" href="#main">Skip to main content</a>

<matrika-header>
  <div class="mt-header-wrap"><header class="site-header"><a class="mt-brand-link" href="index.html">Matrika</a></header></div>
</matrika-header>

<main id="main" class="mt-main-full">
  <section class="mt-spread">
    <div class="container" style="display:grid; gap:var(--mt-space-5);">
      <header class="mt-page-head" style="margin-bottom:0;">
        <span class="mt-hand-note">unicode &amp; latin search index</span>
        <h1 class="mt-page-title">Search Archive</h1>
      </header>

      <form role="search" class="mt-filter-panel" onsubmit="return false">
        <label for="search-page-q">Search query
          <input id="search-page-q" name="q" type="search" class="mt-input" placeholder="Language, script, title, creator, keyword">
        </label>
        <label for="search-page-group">Record group
          <select id="search-page-group" name="type" class="mt-select">
            <option value="">All groups</option>
            <option value="languages">Languages</option>
            <option value="library">Digital Library</option>
            <option value="images">Photos &amp; Visual Plates</option>
            <option value="audio">Audio</option>
            <option value="stories">Stories</option>
          </select>
        </label>
        <button id="search-page-clear" type="button" class="mt-clear-btn">Clear all</button>
      </form>

      <p id="mt-search-count" aria-live="polite" style="margin:0; font-weight:600;"></p>
      <div id="mt-search-results" style="display:grid; gap:var(--mt-space-5);"></div>
    </div>
  </section>
</main>

<matrika-footer></matrika-footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org https://unpkg.com; connect-src 'self'; base-uri 'self'; form-action 'self';">
<title>Contact &amp; Corrections · Matrika</title>
<meta name="description" content="Report spelling updates, wrong attributions, consent concerns, or takedown requests on Matrika.">
<meta property="og:site_name" content="Matrika">
<meta property="og:title" content="Contact &amp; Corrections · Matrika">
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&family=Caveat:wght@400;600&family=Noto+Serif+Devanagari:wght@400;600&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components/header.css">
<link rel="stylesheet" href="css/components/wordmark.css">
<link rel="stylesheet" href="css/components/footer.css">
<link rel="stylesheet" href="css/components/button.css">
<link rel="stylesheet" href="css/components/badge.css">
<link rel="stylesheet" href="css/components/form.css">
<link rel="stylesheet" href="css/components/chat.css">
<link rel="stylesheet" href="css/print.css" media="print">
<script type="module" src="js/main.js"></script>
</head>
<body class="mt-paper-grain" data-page="contact">
<a class="skip-link" href="#main">Skip to main content</a>

<matrika-header>
  <div class="mt-header-wrap"><header class="site-header"><a class="mt-brand-link" href="index.html">Matrika</a></header></div>
</matrika-header>

<main id="main" class="mt-main-full">
  <section class="mt-spread">
    <div class="container" style="display:grid; gap:var(--mt-space-5);">
      <header class="mt-page-head" style="margin-bottom:0;">
        <span class="mt-hand-note">takedowns, attribution &amp; orthography updates</span>
        <h1 class="mt-page-title">Contact / Report a Correction</h1>
        <p class="mt-muted" style="margin:0;">Demonstration prototype — nothing entered here is transmitted off your browser.</p>
      </header>

      <form id="mt-contact-form" class="mt-form-editorial" novalidate>
        <div class="mt-field">
          <label for="mt-contact-name">Name (required)</label>
          <input id="mt-contact-name" class="mt-input" name="name" type="text" required>
        </div>
        <div class="mt-field">
          <label for="mt-contact-email">Email (required)</label>
          <input id="mt-contact-email" class="mt-input" name="email" type="email" required>
        </div>
        <div class="mt-field">
          <label for="mt-contact-record">Record ID or language (optional)</label>
          <input id="mt-contact-record" class="mt-input" name="record" type="text" placeholder="e.g. res-tulu-paddana-04 or Koda">
        </div>
        <div class="mt-field">
          <label for="mt-contact-msg">Correction or takedown note (required)</label>
          <textarea id="mt-contact-msg" class="mt-textarea" name="msg" required></textarea>
        </div>
        <div>
          <button type="submit" class="mt-btn mt-btn--solid">Send report</button>
        </div>
        <p class="form-status mt-status-banner" role="status" aria-live="polite" hidden>Correction report recorded locally inside this static prototype preview (no email server connected).</p>
      </form>
    </div>
  </section>
</main>

<matrika-footer></matrika-footer>
</body>
</html>
